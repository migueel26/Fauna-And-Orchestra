name: Build

on: [push, pull_request]

jobs:
  server-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test server run
        env:
          FAUNA_IS_TEST_SERVER: "true"
        run: ./gradlew runServer --no-daemon

      - name: Upload crash reports and logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-crash-logs
          path: |
            run/crash-reports/
            run/logs/
          retention-days: 7

  build:
    needs: server-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build
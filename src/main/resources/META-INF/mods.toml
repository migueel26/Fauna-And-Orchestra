modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

# --- MIXINS ---
[[mixins]]
config = "mixins.faunaandorchestra.json"

# --- DEPENDENCIES ---

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
mandatory = true
versionRange = "[4.4.5,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "patchouli"
mandatory = true
versionRange = "[1.20.1-84.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jei"
mandatory = false
versionRange = "[15.20.0.112,)"
ordering = "NONE"
side = "CLIENT"
